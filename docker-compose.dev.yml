# Local development dependencies for realtime-media-backend.
#
#   docker compose -f docker-compose.dev.yml up -d
#
# IMPORTANT: Run the shared infrastructure FIRST:
#   cd ../backend && docker compose -f docker-compose.dev.yml up -d
#
# This compose file only runs LiveKit (media-specific). Redis, Postgres,
# and Redpanda (Kafka) come from the canonical stack in the backend repo.
#
# Ports:
#   LiveKit:  7880 (WebSocket/HTTP), 7881 (RTC/UDP)
name: inclusaai-media-dev

services:
  # ---- LiveKit SFU (media-specific) ----
  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"
      - "7881:7881"
    environment:
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - LIVEKIT_REDIS_URL=redis://host.docker.internal:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
